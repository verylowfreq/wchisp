name: Rust

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "devices/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "devices/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
  release:
    types: [created]
  schedule:
    - cron: "0 14 * * *" # Daily at 2 PM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: win-x64
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-x64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-aarch64
            ext: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: macos-x64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: macos-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install Zig
        if: matrix.cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Run help
        if: ${{ !matrix.cross }}
        run: cargo run --release --target ${{ matrix.target }} -- --help

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p wchisp-${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/wchisp${{ matrix.ext }} wchisp-${{ matrix.artifact }}/
          cp README.md wchisp-${{ matrix.artifact }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wchisp-${{ matrix.artifact }}
          path: wchisp-${{ matrix.artifact }}

      - name: Create release archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip wchisp-${{ github.event.release.tag_name }}-${{ matrix.artifact }}.zip wchisp-${{ matrix.artifact }}
          else
            tar -czvf wchisp-${{ github.event.release.tag_name }}-${{ matrix.artifact }}.tar.gz wchisp-${{ matrix.artifact }}
          fi

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            wchisp-*.tar.gz
            wchisp-*.zip

  nightly-release:
    name: Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare nightly release metadata
        id: nightly
        shell: bash
        run: |
          date_utc="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          tag="nightly-${date_utc}-${short_sha}"
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'nightly-*' | head -n 1)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$date_utc" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Reusing nightly tag $tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$existing_tag" ]]; then
            echo "Nightly $existing_tag already exists for $GITHUB_SHA"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.nightly.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: Create archives
        if: steps.nightly.outputs.publish == 'true'
        run: |
          for dir in wchisp-*/; do
            name="${dir%/}"
            echo "Compressing $name"
            if [[ $name == wchisp-win* ]]; then
              zip -r "$name.zip" "$name"
            else
              tar -czvf "$name.tar.gz" "$name"
            fi
          done

      - name: Create nightly release
        if: steps.nightly.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: wchisp nightly release ${{ steps.nightly.outputs.date }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            This is a nightly binary release of the wchisp command line tool.
          files: |
            wchisp-*.tar.gz
            wchisp-*.zip
